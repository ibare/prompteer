name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_call:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} 준비
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 테스트 실행
        run: pytest

      - name: doctest 실행
        run: pytest --no-cov --doctest-modules src/prompteer/template.py src/prompteer/blocks.py

      - name: 예시 실행 확인
        run: |
          for f in examples/basic_usage.py examples/advanced_usage.py \
                   examples/blocks_usage.py examples/dynamic_routing.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done
